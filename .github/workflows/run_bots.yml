- name: Commit and push updated balances and trades
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add account_balance.txt active_paper_trades.csv bot_activity_log.csv flexible_balance.txt active_flexible_trades.csv bot_activity_log_flexible.csv 2>/dev/null || true
        git diff --staged --quiet || git commit -m "Update both bots states and trades"
        git push
