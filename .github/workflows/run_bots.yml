name: Run Trading Bots

on:
  schedule:
    - cron: '0 * * * *'  # يعمل تلقائياً كل ساعة
  workflow_dispatch:      # يتيح لك التشغيل اليدوي متى شئت من تبويب Actions

jobs:
  run-bots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Strict Bot
        run: python trading_bot.py

      - name: Run Flexible Bot
        run: python trading_bot_flexible.py
