name: Run Trading Bots

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy

    - name: Run Strict Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python trading_bot.py

    - name: Run Flexible Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_FLEXIBLE }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python trading_bot_flexible.py

    - name: Run Balanced Bot
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python balanced_bot.py

    - name: Run Global S&R Scanner Bot
      run: |
        python trading_bot_global.py

    - name: Run Lightning Scalper Bot
      run: |
        python trading_bot_scalper.py

    - name: Commit and push updated balances and trades
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git fetch origin main
        git reset --soft origin/main || true
        
        git add active_flexible_trades.csv active_strict_trades.csv active_balanced_trades.csv active_global_trades.csv active_scalper_trades.csv flexible_balance.txt strict_balance.txt balanced_balance.txt global_balance.txt scalper_balance.txt closed_global_trades_history.csv closed_flexible_trades_history.csv closed_scalper_trades_history.csv 2>/dev/null || true
        
        git diff --staged --quiet || git commit -m "Update all 5 bots states, balances, and trade history automatically"
        git push origin main
