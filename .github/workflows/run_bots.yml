name: Run Trading Bots

on:
  schedule:
    - cron: '0 * * * *' # يعمل تلقائياً في بداية كل ساعة
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى شئت من الموقع

jobs:
  run-bots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests numpy pandas pandas_ta

      - name: Run Trading Bots
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python trading_bot.py || true
          python trading_bot_flexible.py || true
